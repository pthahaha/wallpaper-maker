<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잠금화면 문구 만들기</title>
<meta name="description" content="원하는 문구를 넣어 아이폰·갤럭시 잠금화면 배경을 만듭니다. 설치 없이 브라우저에서 바로.">
<meta name="theme-color" content="#0A0B0D">

<!-- 홈 화면에 추가하면 앱처럼 전체화면으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="잠금화면">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="잠금화면 문구 만들기">
<meta property="og:description" content="원하는 문구를 넣어 아이폰·갤럭시 잠금화면 배경을 만듭니다.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<style>
  :root {
    --bg: #0A0B0D; --panel: #14161A; --line: #22262C;
    --fg: #F2F2EF; --muted: #6E7684; --dim: #5E656F; --accent: #E0A040;
    --sans: "Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.5; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; max-width:960px; margin:0 auto; padding:24px 20px 60px; align-items:start; }
  @media (max-width:780px){ .wrap{grid-template-columns:minmax(0,1fr);} .preview-col{order:-1; position:static;} }

  h1 { font-size:19px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 26px; }

  .group { margin-bottom:22px; }
  .group > label.eyebrow { display:block; font-size:10px; font-weight:600; letter-spacing:.26em; color:var(--muted); margin-bottom:9px; }

  input[type=text], select {
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:9px;
    color:var(--fg); font-family:var(--sans); font-size:15px; padding:11px 13px; outline:none;
    -webkit-appearance:none; appearance:none;
  }
  select { background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
           background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%; background-size:6px 6px,6px 6px; background-repeat:no-repeat; }
  input[type=text]:focus, select:focus { border-color:var(--accent); }
  input[type=text]::placeholder { color:#444A54; }
  input[type=number]{ width:100%; background:var(--panel); border:1px solid var(--line); border-radius:9px; color:var(--fg); font-family:var(--sans); font-size:15px; padding:11px 13px; outline:none; }

  .field { margin-bottom:9px; }
  .field .cap { font-size:11px; color:var(--dim); margin-bottom:4px; display:block; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:9px; }

  .item-row { display:flex; gap:8px; margin-bottom:8px; }
  .item-row input { flex:1; }
  .icon-btn { width:42px; flex:0 0 42px; background:var(--panel); border:1px solid var(--line); border-radius:9px; color:var(--dim); font-size:18px; cursor:pointer; }
  .icon-btn:active { border-color:var(--accent); color:var(--accent); }
  .add-btn { width:100%; background:transparent; border:1px dashed var(--line); border-radius:9px; color:var(--muted); font-family:var(--sans); font-size:14px; padding:10px; cursor:pointer; }
  .add-btn:active { border-color:var(--accent); color:var(--accent); }

  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-family:var(--sans); font-size:13px; padding:9px 10px; cursor:pointer; }
  .seg button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }

  .swatches { display:flex; gap:8px; }
  .swatches button { width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatches button[aria-pressed=true] { border-color:var(--fg); }

  input[type=range]{ width:100%; accent-color:var(--accent); }

  .check { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; }
  .check input { accent-color:var(--accent); width:16px; height:16px; }

  @media (min-width:781px){ .preview-col { position:sticky; top:24px; } }
  .phone { position:relative; width:100%; max-width:290px; margin:0 auto 10px; border-radius:34px; overflow:hidden; border:1px solid #2A2F36; box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .phone canvas { width:100%; height:auto; display:block; }
  .dims { text-align:center; font-size:11px; color:var(--dim); margin-bottom:14px; letter-spacing:.04em; }

  .ov { position:absolute; left:0; right:0; pointer-events:none; color:#fff; text-align:center; opacity:.82; }
  .ov-date { font-size:9px; }
  .ov-time { font-weight:300; letter-spacing:-.02em; line-height:1; }
  .ov-widget { border:1px dashed rgba(255,255,255,.32); border-radius:7px; }
  .ov-bottom { display:flex; justify-content:space-between; }
  .ov-bottom i { border-radius:50%; background:rgba(255,255,255,.16); display:block; }

  .actions { display:grid; gap:9px; max-width:290px; margin:0 auto; }
  .primary { background:var(--accent); border:none; border-radius:11px; color:#0A0B0D; font-family:var(--sans); font-size:15px; font-weight:700; padding:14px; cursor:pointer; text-align:center; text-decoration:none; display:block; }
  .ghost { background:transparent; border:1px solid var(--line); border-radius:11px; color:var(--muted); font-family:var(--sans); font-size:13px; padding:11px; cursor:pointer; }
  .hint { font-size:12px; color:var(--dim); max-width:290px; margin:12px auto 0; line-height:1.6; }
  .hint b { color:var(--muted); font-weight:600; }

  #saveArea { max-width:290px; margin:14px auto 0; display:none; }
  #saveArea img { width:100%; border-radius:12px; display:block; border:1px solid var(--line); }
  #saveArea #dlBtn { margin-top:10px; }
  #saveArea p { font-size:12px; color:var(--dim); margin:9px 0 0; line-height:1.6; }
  #saveArea p b { color:var(--accent); font-weight:600; }
</style>

<div class="wrap">
  <div class="controls">
    <h1>잠금화면 문구 만들기</h1>
    <p class="sub" id="deviceSub">기기를 고르고 문구를 입력하세요</p>

    <div class="group">
      <label class="eyebrow">기기</label>
      <div class="field">
        <select id="device"></select>
      </div>
      <div class="two" id="customSize" style="display:none">
        <div><span class="cap">가로 px</span><input type="number" id="cw" value="1179" min="320" max="4000"></div>
        <div><span class="cap">세로 px</span><input type="number" id="ch" value="2556" min="480" max="6000"></div>
      </div>
    </div>

    <div class="group">
      <label class="eyebrow">상단 문구</label>
      <div class="field"><input type="text" id="quote" value="시간은 누구에게나 공평하다" placeholder="한 줄 문구"></div>
    </div>

    <div class="group">
      <label class="eyebrow">항목</label>
      <div class="field"><span class="cap">구분 라벨</span><input type="text" id="sectionLabel" value="매일"></div>
      <div id="items"></div>
      <button class="add-btn" id="addItem">＋ 항목 추가</button>
    </div>

    <div class="group">
      <label class="eyebrow">마무리</label>
      <div class="field"><span class="cap">작게</span><input type="text" id="closingSmall" value="마음 먹기 나름"></div>
      <div class="field"><span class="cap">크게 · 강조색</span><input type="text" id="closingBig" value="한번 해보자"></div>
      <div class="field"><span class="cap">서명</span><input type="text" id="signature" value="일단비버"></div>
    </div>

    <div class="group">
      <label class="eyebrow">항목 앞 표시</label>
      <div class="seg" id="markerSeg">
        <button data-v="none" aria-pressed="true">없음</button>
        <button data-v="number" aria-pressed="false">01 02 03</button>
        <button data-v="bar" aria-pressed="false">세로바</button>
        <button data-v="dot" aria-pressed="false">점</button>
      </div>
    </div>

    <div class="group">
      <label class="eyebrow">강조색</label>
      <div class="swatches" id="colorSwatches">
        <button data-v="#E0A040" aria-pressed="true" style="background:#E0A040"></button>
        <button data-v="#7FA7C4" aria-pressed="false" style="background:#7FA7C4"></button>
        <button data-v="#8FB08A" aria-pressed="false" style="background:#8FB08A"></button>
        <button data-v="#C77B6B" aria-pressed="false" style="background:#C77B6B"></button>
        <button data-v="#F2F2EF" aria-pressed="false" style="background:#F2F2EF"></button>
      </div>
    </div>

    <div class="group">
      <label class="eyebrow">배경 사진</label>
      <input type="file" id="bgFile" accept="image/*" hidden>
      <button class="add-btn" id="bgPick">사진 선택</button>
      <div id="bgOpts" style="display:none">
        <div class="field" style="margin-top:9px"><span class="cap">어둡기</span>
          <input type="range" id="bgDim" min="0" max="90" value="60"></div>
        <button class="ghost" id="bgClear" style="width:100%">사진 제거</button>
      </div>
    </div>

    <div class="group">
      <label class="check"><input type="checkbox" id="showGuide" checked> 미리보기에 시계·위젯 위치 표시</label>
    </div>
  </div>

  <div class="preview-col">
    <div class="phone" id="phone">
      <canvas id="cv" width="1179" height="2556"></canvas>
      <div class="ov ov-date" id="ovDate"></div>
      <div class="ov ov-time" id="ovTime">9:41</div>
      <div class="ov ov-widget" id="ovWidget"></div>
      <div class="ov ov-bottom" id="ovBottom"><i></i><i></i></div>
    </div>
    <p class="dims" id="dims">1179 × 2556</p>

    <div class="actions">
      <button class="primary" id="makeBtn">이미지 만들기</button>
      <button class="ghost" id="resetBtn">기본값으로 되돌리기</button>
    </div>

    <div id="saveArea">
      <img id="outImg" alt="완성된 배경화면">
      <a class="primary" id="dlBtn" download="lockscreen.png">PNG 다운로드</a>
      <p id="saveMsg"></p>
    </div>

    <p class="hint">점선은 <b>위젯 자리</b>, 위쪽은 <b>시계</b>입니다. 문구가 가려지지 않는지 확인하세요.</p>
  </div>
</div>

<script>
(function () {

  /* ============ 기기 프리셋 ============
     safe: 화면 높이 대비 비율. 기기마다 시계/위젯/하단버튼 위치가 다르다.
     ios     : 시계 작게 상단, 아래 위젯 줄, 하단 좌우 버튼(손전등·카메라)
     samsung : One UI 기준. 시계가 크고 조금 아래, 하단 좌우 버튼(전화·카메라)
  */
  const SAFE = {
    ios:     { dateTop:.065, timeTop:.093, timeSize:.021, widgetTop:.205, widgetH:.045, bottom:.032, showBottom:true },
    samsung: { dateTop:.100, timeTop:.128, timeSize:.034, widgetTop:.255, widgetH:.050, bottom:.048, showBottom:true }
  };

  const DEVICES = [
    { g:'iPhone', n:'iPhone 14/15/16 Pro · 15 · 16', w:1179, h:2556, os:'ios' },
    { g:'iPhone', n:'iPhone 16 Pro',                 w:1206, h:2622, os:'ios' },
    { g:'iPhone', n:'iPhone 14/15 Pro Max · Plus',   w:1290, h:2796, os:'ios' },
    { g:'iPhone', n:'iPhone 16 Pro Max',             w:1320, h:2868, os:'ios' },
    { g:'iPhone', n:'iPhone 13/14 · 12',             w:1170, h:2532, os:'ios' },
    { g:'iPhone', n:'iPhone 13 mini',                w:1080, h:2340, os:'ios' },
    { g:'iPhone', n:'iPhone 11 · XR',                 w:828,  h:1792, os:'ios' },
    { g:'iPhone', n:'iPhone SE (2·3세대)',            w:750,  h:1334, os:'ios' },
    { g:'Galaxy', n:'S25 · S24 · S23',              w:1080, h:2340, os:'samsung' },
    { g:'Galaxy', n:'S25+ · S24+ · S25/S24 Ultra',  w:1440, h:3120, os:'samsung' },
    { g:'Galaxy', n:'S23 Ultra · S22 Ultra',        w:1440, h:3088, os:'samsung' },
    { g:'Galaxy', n:'Z Flip 6 · Flip 5',            w:1080, h:2640, os:'samsung' },
    { g:'Galaxy', n:'Z Fold 6 (외부화면)',            w:968,  h:2376, os:'samsung' },
    { g:'Galaxy', n:'Z Fold 6 (내부화면)',            w:1856, h:2160, os:'samsung' },
    { g:'Galaxy', n:'A 시리즈 (FHD+)',                w:1080, h:2340, os:'samsung' },
    { g:'Galaxy Note', n:'Note 20 Ultra',            w:1440, h:3088, os:'samsung' },
    { g:'Galaxy Note', n:'Note 20',                  w:1080, h:2400, os:'samsung' },
    { g:'Galaxy Note', n:'Note 10+ · Note 10 Lite',  w:1440, h:3040, os:'samsung' },
    { g:'Galaxy Note', n:'Note 10',                  w:1080, h:2280, os:'samsung' },
    { g:'Galaxy Note', n:'Note 9 · Note 8',          w:1440, h:2960, os:'samsung' },
    { g:'기타',   n:'iPad Pro 11"',                   w:1668, h:2388, os:'ios' },
    { g:'기타',   n:'Galaxy Tab S9',                  w:1600, h:2560, os:'samsung' },
    { g:'기타',   n:'직접 입력',                        w:1179, h:2556, os:'ios', custom:true }
  ];

  /* ============ 레이아웃 (비율 기반) ============
     세로: 화면 높이의 몇 %인지로 지정 → 어떤 해상도든 같은 비례로 배치
     크기: 기준폭 1179 대비 스케일 → 폭이 좁으면 글자도 같이 작아짐
  */
  const REF_W = 1179;
  const L = {
    padX:     130 / REF_W,   // 좌우 여백 (폭 대비)
    quoteY:   .3130,
    ruleGap:  .0258,
    labelY:   .3951,
    itemY:    .4577,
    itemStep: .0587,
    closeMax: .6886,
    closeGap: .0509,
    signY:    .8607
  };

  const SANS  = '"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif';
  const SERIF = 'AppleMyungjo,"Apple SD Gothic Neo","Noto Serif KR",serif';
  const C = { bgTop:'#0A0B0D', bgMid:'#101216', fg:'#F2F2EF', muted:'#6E7684',
              dim:'#5E656F', line:'#22262C', mark:'#4A505C', sign:'#3E434C' };

  const DEFAULTS = {
    quote:'시간은 누구에게나 공평하다', sectionLabel:'매일',
    items:['운동','청소','독서'],
    closingSmall:'마음 먹기 나름', closingBig:'한번 해보자',
    signature:'일단비버', marker:'none', accent:'#E0A040', device:0, bgDim:.6
  };
  let state = JSON.parse(JSON.stringify(DEFAULTS));
  let bgImg = null;   // 업로드한 배경 사진 (Image), 상태와 별도 보관

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function dev() {
    const d = DEVICES[state.device];
    if (d.custom) {
      return { ...d,
        w: clamp(+document.getElementById('cw').value || 1179, 320, 4000),
        h: clamp(+document.getElementById('ch').value || 2556, 480, 6000) };
    }
    return d;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- 텍스트 헬퍼 ---------- */

  function fitFont(text, weight, size, family, maxW) {
    let s = size;
    while (s > 8) {
      ctx.font = weight + ' ' + s + 'px ' + family;
      if (ctx.measureText(text).width <= maxW) break;
      s -= 1;
    }
    return s;
  }
  function drawText(text, x, y, weight, size, family, color, maxW) {
    if (!text) return;
    const s = fitFont(text, weight, size, family, maxW);
    ctx.font = weight + ' ' + s + 'px ' + family;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
  function drawTracked(text, x, y, weight, size, family, color, track) {
    if (!text) return;
    ctx.font = weight + ' ' + size + 'px ' + family;
    ctx.fillStyle = color;
    let cx = x;
    for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + track; }
  }

  /* ---------- 렌더 ---------- */

  function render() {
    const d = dev();
    const W = d.w, H = d.h;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }

    const S = W / REF_W;          // 폭 기준 스케일
    const padX = L.padX * W;
    const maxW = W - padX * 2;

    if (bgImg) {
      const r = Math.max(W / bgImg.width, H / bgImg.height);   // cover, 중앙 크롭
      const dw = bgImg.width * r, dh = bgImg.height * r;
      ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.fillStyle = 'rgba(10,11,13,' + state.bgDim + ')';
      ctx.fillRect(0, 0, W, H);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, C.bgTop); g.addColorStop(.55, C.bgMid); g.addColorStop(1, C.bgTop);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.textBaseline = 'alphabetic';

    // 상단 문구
    const qy = L.quoteY * H;
    drawText(state.quote, padX, qy, '400', 58 * S, SERIF, C.muted, maxW);

    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, 2 * S);
    ctx.beginPath();
    ctx.moveTo(padX, qy + L.ruleGap * H);
    ctx.lineTo(W - padX, qy + L.ruleGap * H);
    ctx.stroke();

    // 라벨
    drawTracked(state.sectionLabel, padX, L.labelY * H, '500', 36 * S, SANS, '#7A8393', 14 * S);

    // 항목
    const items = state.items.filter(t => t.trim() !== '');
    const shrink = items.length > 4 ? .85 : 1;
    const step = L.itemStep * H * shrink;
    const fsize = 104 * S * shrink;

    let y = L.itemY * H;
    items.forEach((item, i) => {
      let tx = padX;

      if (state.marker === 'number') {
        drawText(String(i + 1).padStart(2, '0'), padX, y, '500', 40 * S, SANS, C.mark, 140 * S);
        tx = padX + 108 * S;
      } else if (state.marker === 'bar') {
        ctx.fillStyle = state.accent; ctx.globalAlpha = .55;
        const bh = fsize * .72;
        ctx.beginPath(); ctx.roundRect(padX, y - bh, 8 * S, bh, 4 * S); ctx.fill();
        ctx.globalAlpha = 1;
        tx = padX + 70 * S;
      } else if (state.marker === 'dot') {
        ctx.fillStyle = C.mark;
        ctx.beginPath(); ctx.arc(padX + 12 * S, y - fsize * .28, 11 * S, 0, Math.PI * 2); ctx.fill();
        tx = padX + 62 * S;
      }

      drawText(item, tx, y, '700', fsize, SANS, C.fg, W - padX - tx);
      y += step;
    });

    // 마무리 — 항목이 많아지면 아래로 밀리되 상한을 둔다
    y += step * .6;
    if (y > L.closeMax * H) y = L.closeMax * H;

    drawText(state.closingSmall, padX, y, '400', 56 * S, SANS, C.dim, maxW);
    y += L.closeGap * H;
    drawText(state.closingBig, padX, y, '700', 96 * S, SANS, state.accent, maxW);

    // 서명
    drawTracked(state.signature, padX, L.signY * H, '500', 44 * S, SERIF, C.sign, 10 * S);

    layoutOverlay(d);
    document.getElementById('dims').textContent = W + ' × ' + H;
  }

  /* ---------- 미리보기 가이드 ---------- */

  function layoutOverlay(d) {
    const s = SAFE[d.os];
    const box = document.getElementById('phone');
    const pxH = box.clientHeight || 1;

    const set = (id, css) => Object.assign(document.getElementById(id).style, css);

    set('ovDate',   { top: (s.dateTop * 100) + '%' });
    set('ovTime',   { top: (s.timeTop * 100) + '%', fontSize: (s.timeSize * pxH) + 'px' });
    set('ovWidget', { top: (s.widgetTop * 100) + '%', height: (s.widgetH * 100) + '%',
                      left: '12%', right: '12%' });
    set('ovBottom', { display: s.showBottom ? 'flex' : 'none',
                      bottom: (s.bottom * 100) + '%', left: '22%', right: '22%',
                      height: '4%' });
    document.querySelectorAll('#ovBottom i').forEach(el => {
      el.style.width = (pxH * .028) + 'px';
      el.style.height = (pxH * .028) + 'px';
    });
  }

  /* ---------- 기기 선택 UI ---------- */

  (function buildDeviceSelect() {
    const sel = document.getElementById('device');
    let group = null, og = null;
    DEVICES.forEach((d, i) => {
      if (d.g !== group) { group = d.g; og = document.createElement('optgroup'); og.label = d.g; sel.appendChild(og); }
      const o = document.createElement('option');
      o.value = i;
      o.textContent = d.custom ? d.n : d.n + '  (' + d.w + '×' + d.h + ')';
      og.appendChild(o);
    });
    sel.value = '0';
    sel.addEventListener('change', () => {
      state.device = +sel.value;
      document.getElementById('customSize').style.display = DEVICES[state.device].custom ? 'grid' : 'none';
      render();
    });
    ['cw','ch'].forEach(id => document.getElementById(id).addEventListener('input', render));
  })();

  /* ---------- 항목 UI ---------- */

  function renderItems() {
    const box = document.getElementById('items');
    box.innerHTML = '';
    state.items.forEach((val, i) => {
      const row = document.createElement('div'); row.className = 'item-row';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = val; inp.placeholder = '항목 ' + (i + 1);
      inp.addEventListener('input', () => { state.items[i] = inp.value; render(); });
      const del = document.createElement('button');
      del.className = 'icon-btn'; del.textContent = '−'; del.title = '삭제';
      del.addEventListener('click', () => { state.items.splice(i, 1); renderItems(); render(); });
      row.appendChild(inp);
      if (state.items.length > 1) row.appendChild(del);
      box.appendChild(row);
    });
  }

  /* ---------- 바인딩 ---------- */

  ['quote','sectionLabel','closingSmall','closingBig','signature'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => { state[id] = el.value; render(); });
  });

  document.getElementById('addItem').addEventListener('click', () => {
    if (state.items.length >= 6) return;
    state.items.push(''); renderItems(); render();
  });

  function bindSeg(containerId, key, after) {
    const box = document.getElementById(containerId);
    box.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        box.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        state[key] = b.dataset.v; render(); if (after) after();
      });
    });
  }
  bindSeg('markerSeg','marker');
  bindSeg('colorSwatches','accent', () => {
    document.documentElement.style.setProperty('--accent', state.accent);
  });

  /* ---------- 배경 사진 ---------- */

  const bgFile = document.getElementById('bgFile');
  document.getElementById('bgPick').addEventListener('click', () => bgFile.click());
  bgFile.addEventListener('change', () => {
    const f = bgFile.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      // 한 번만 축소해 두면 이후 매 렌더가 가벼워진다
      // ponytail: 최장변 2600px 고정, 3120px급 기기에선 살짝 업스케일됨
      const MAX = 2600, r = Math.min(1, MAX / Math.max(img.width, img.height));
      if (r < 1) {
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        bgImg = c;
      } else {
        bgImg = img;
      }
      document.getElementById('bgOpts').style.display = 'block';
      render();
    };
    img.src = URL.createObjectURL(f);
  });
  document.getElementById('bgDim').addEventListener('input', e => {
    state.bgDim = e.target.value / 100; render();
  });
  function clearBg() {
    bgImg = null; bgFile.value = '';
    state.bgDim = DEFAULTS.bgDim;
    document.getElementById('bgDim').value = DEFAULTS.bgDim * 100;
    document.getElementById('bgOpts').style.display = 'none';
  }
  document.getElementById('bgClear').addEventListener('click', () => { clearBg(); render(); });

  document.getElementById('showGuide').addEventListener('change', e => {
    const show = e.target.checked;
    ['ovDate','ovTime','ovWidget','ovBottom'].forEach(id => {
      document.getElementById(id).style.visibility = show ? 'visible' : 'hidden';
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    const keepDevice = state.device;
    state = JSON.parse(JSON.stringify(DEFAULTS));
    state.device = keepDevice;
    ['quote','sectionLabel','closingSmall','closingBig','signature'].forEach(id => {
      document.getElementById(id).value = state[id];
    });
    document.querySelectorAll('#markerSeg button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.v === state.marker)));
    document.querySelectorAll('#colorSwatches button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.v === state.accent)));
    document.documentElement.style.setProperty('--accent', state.accent);
    clearBg();
    renderItems(); render();
    document.getElementById('saveArea').style.display = 'none';
  });

  document.getElementById('makeBtn').addEventListener('click', () => {
    render();
    const d = dev();
    const url = cv.toDataURL('image/png');
    document.getElementById('outImg').src = url;

    const dt = new Date();
    const stamp = dt.getFullYear() + String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0');
    const dl = document.getElementById('dlBtn');
    dl.href = url;
    dl.download = 'lockscreen-' + d.w + 'x' + d.h + '-' + stamp + '.png';
    dl.click();   // 바로 다운로드

    const isPhone = /iPhone|iPad|Android/.test(navigator.userAgent);
    document.getElementById('saveMsg').innerHTML = isPhone
      ? '<b>이미지를 길게 눌러 사진 앱에 저장</b>하세요. 다운로드 버튼은 파일 앱으로 가서 한 단계 더 걸립니다.'
      : '다운로드하거나 이미지를 우클릭해 저장할 수 있습니다.';

    document.getElementById('saveArea').style.display = 'block';
    document.getElementById('saveArea').scrollIntoView({ behavior:'smooth', block:'center' });
  });

  /* ---------- 날짜 ---------- */
  (function () {
    const d = new Date(), days = ['일','월','화','수','목','금','토'];
    document.getElementById('ovDate').textContent =
      (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일';
  })();

  window.addEventListener('resize', () => layoutOverlay(dev()));

  renderItems();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
</body>
</html>
